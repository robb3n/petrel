<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Shoal tailnet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&amp;family=Rubik:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&amp;display=block">
<style>
body{margin:0}
.phone{--wall:#E9E1D3;--sf:#FEF6EE;--sf2:#F6ECDF;--sf3:#ECE0CF;--tx:#2A2217;--tx2:#8A7C65;--hair:#EADFCF;--em:#B1A48E;--ol:#705A0F;--onol:#FFF6E0;--butter:#F6DE96;--butterInk:#2A1800;--sage:#4E604E;--sageInk:#DCEADA;--mint:#CCEAC6;--mintInk:#1F3B22;--s3:#4E604E;--shIsle:0 16px 32px -18px rgba(70,48,18,.40),0 2px 6px rgba(70,48,18,.10),0 0 0 .5px rgba(70,48,18,.08);--shPill:0 2px 3px -1px rgba(70,48,18,.38),0 0 0 .5px rgba(70,48,18,.07);--ui:"Rubik","Noto Sans SC","PingFang SC",system-ui,sans-serif;--disp:"Oswald","Rubik","Noto Sans SC",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;width:390px;height:844px;position:relative;overflow:hidden;background:var(--wall);color:var(--tx);font-family:var(--ui);font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased}
.phone[data-theme="dark"]{--wall:#14120E;--sf:#221E18;--sf2:#2B261E;--sf3:#383126;--tx:#EDE4D6;--tx2:#A3977F;--hair:#302A21;--em:#7C715F;--ol:#D4B35B;--onol:#2A1800;--butter:#4A3E1E;--butterInk:#F6DE96;--sage:#4E604E;--sageInk:#DCEADA;--mint:#2C4230;--mintInk:#CCEAC6;--s3:#9DBB9D;--shIsle:0 16px 32px -18px rgba(0,0,0,.75),0 0 0 .5px rgba(255,240,210,.07);--shPill:0 2px 4px -1px rgba(0,0,0,.6),0 0 0 .5px rgba(255,240,210,.07)}
.phone *{box-sizing:border-box}
:where(.phone) a{color:inherit;text-decoration:none}
:where(.phone) button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 500;user-select:none;flex:none}
.ms.f{font-variation-settings:"FILL" 1,"wght" 500}
.appbar{height:56px;display:flex;align-items:center;gap:8px;padding:0 8px 0 18px}
.appbar h1{margin:0;font:600 20px/1.2 var(--ui);letter-spacing:.01em}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--tx2);flex:none}
.ib .ms{font-size:20px}
.scroll{position:absolute;left:0;right:0;top:56px;bottom:0;overflow-y:auto;scrollbar-width:none;padding:4px 12px 100px}
.scroll::-webkit-scrollbar{display:none}
.tag{font:500 10.5px/1 var(--ui);padding:4px 7px;border-radius:999px;background:var(--sf2);color:var(--tx2);flex:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.live{background:var(--mint);color:var(--mintInk)}
.tag.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#4F9A5B}
.lat{font:500 12px/1 var(--ui);padding:4px 8px;border-radius:999px;flex:none;white-space:nowrap}
.lat.ok{background:var(--mint);color:var(--mintInk)}.lat.warn{background:var(--butter);color:var(--butterInk)}.lat.idle{background:var(--sf3);color:var(--tx2)}
.lbl{font:600 11px/1 var(--ui);letter-spacing:.08em;color:var(--tx2);margin:16px 6px 8px;display:flex;align-items:center;gap:6px}
.lbl em{font-style:normal;font-weight:500;letter-spacing:.02em;color:var(--em);font-family:var(--mono);font-size:10.5px}
.foot{margin:10px 4px 0;font-size:11.5px;line-height:1.5;color:var(--tx2)}
.mini{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 12px 0 10px;border-radius:999px;background:var(--sf2);font:500 12.5px var(--ui);color:var(--tx);flex:none;white-space:nowrap}
.mini .ms{font-size:17px}
.tile{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.tile .ms{font-size:20px}
.t-mint{background:var(--mint);color:var(--mintInk)}
.isle{background:var(--sf);border-radius:24px;padding:14px;box-shadow:var(--shIsle);margin-bottom:12px}
.isle.tight{padding:6px}
.ph{display:flex;align-items:center;gap:10px}
.ph>div{flex:1;min-width:0}
.ph h3{margin:0;font:600 15px/1.25 var(--ui)}
.ph p{margin:2px 0 0;font-size:12px;color:var(--tx2);line-height:1.4}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 0;padding:10px 12px;background:var(--sf2);border-radius:16px}
.kv div{min-width:0}
.kv dt{font-size:10.5px;color:var(--tx2);letter-spacing:.04em}
.kv dd{margin:3px 0 0;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;align-items:center;gap:8px;margin-top:12px}
.acts small{font-size:11.5px;color:var(--tx2)}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;width:100%}
.row>.ms{font-size:19px;color:var(--tx2);width:22px;text-align:center}
.row .g{flex:1;min-width:0}
.row b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--tx2);font-size:11.5px;margin-top:1px;font-variant-numeric:tabular-nums}
.row.off b,.row.off>.ms{color:var(--tx2)}
.fnav{position:absolute;left:12px;right:12px;bottom:16px;height:56px;background:var(--sf);border-radius:999px;box-shadow:var(--shIsle);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:5px;z-index:5}
.fnav a{border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font:500 13px var(--ui);color:var(--tx2)}
.fnav a .ms{font-size:21px}
.fnav a.on{background:var(--ol);color:var(--onol)}
.fnav a.on .ms{font-variation-settings:"FILL" 1,"wght" 500}
</style>
</helmet>
<div class="phone" data-theme="{{theme}}">
  <header class="appbar">
    <h1>tailnet</h1>
    <span class="tag live">已连接</span>
    <span class="sp"></span>
  </header>
  <main class="scroll">
    <section class="isle">
      <div class="ph">
        <span class="tile t-mint"><span class="ms">smartphone</span></span>
        <div><h3>op12-petrel</h3><p>本机 · 已登录 tailnet</p></div>
        <button class="ib" type="button" aria-label="复制地址"><span class="ms">content_copy</span></button>
      </div>
      <dl class="kv">
        <div><dt>本机地址</dt><dd>100.64.0.20</dd></div>
        <div><dt>在线</dt><dd>5 / 6</dd></div>
        <div><dt>路径</dt><dd>直连 4 · 中继 1</dd></div>
      </dl>
      <div class="acts">
        <button class="mini" type="button"><span class="ms">logout</span>登出</button>
        <small>登出后要在电脑浏览器里重新批准</small>
      </div>
    </section>

    <div class="lbl">节点 <em>5 / 6 在线</em></div>
    <section class="isle tight">
      <div class="list">
        <sc-for list="{{peers}}" as="p" hint-placeholder-count="6">
          <div class="{{p.rowCls}}">
            <span class="ms">{{p.os}}</span>
            <div class="g"><b>{{p.name}}</b><small>{{p.ip}}</small></div>
            <span class="{{p.pathCls}}">{{p.path}}</span>
          </div>
        </sc-for>
      </div>
    </section>
    <p class="foot">长按节点复制地址。直连是点对点 WireGuard，中继经 DERP 转发。</p>
  </main>
  <nav class="fnav" aria-label="主导航">
    <a href="Main.dc.html"><span class="ms">power_settings_new</span>连接</a>
    <a href="ShoalNodes.dc.html"><span class="ms">hub</span>节点</a>
    <a class="on" href="ShoalTailnet.dc.html"><span class="ms">lan</span>tailnet</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [
      ['hu', '100.64.0.11', 'dns', '直连', 'ok'],
      ['keystone', '100.64.0.12', 'laptop', '直连', 'ok'],
      ['mba', '100.64.0.13', 'laptop_mac', '直连', 'ok'],
      ['tc-u-se', '100.64.0.14', 'dns', '直连', 'ok'],
      ['hmm', '100.64.0.15', 'dns', '中继 · hkg', 'warn'],
      ['op12', '100.64.0.9', 'smartphone', '离线', 'idle']
    ];
    const peers = P.map(([name, ip, os, path, band]) => ({
      name, ip, os, path,
      pathCls: 'lat ' + band,
      rowCls: band === 'idle' ? 'row off' : 'row'
    }));
    return { theme: this.props.dark ? 'dark' : 'light', peers };
  }
}
</script>
</body>
</html>
