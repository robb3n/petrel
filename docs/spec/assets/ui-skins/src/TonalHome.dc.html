<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Tonal 连接</title>

<helmet>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&amp;display=block">
<style>

.phone[data-theme="dark"]{--pri:#AAC7FF;--onPri:#0A305F;--priC:#284777;--onPriC:#D6E3FF;--secC:#3E4759;--onSecC:#DAE2F9;--terC:#573E5C;--onTerC:#FAD8FD;--sf:#111318;--sfC:#1D2024;--sfH:#282A2F;--sfHH:#33353A;--on:#E2E2E9;--onV:#C4C6D0;--outV:#44474E;--okC:#1E5132;--onOkC:#BDEFC9;--warnC:#5C4300;--onWarnC:#FFDEA6}
.phone *{box-sizing:border-box}

.ms.f{font-variation-settings:"FILL" 1,"wght" 400}
.tbar{height:64px;display:flex;align-items:center;gap:4px;padding:0 4px 0 20px}
.tbar h1{margin:0;font:500 28px/1.2 var(--ui)}
.sp{flex:1}
.icb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--onV)}
.scroll{position:absolute;left:0;right:0;top:64px;bottom:80px;overflow-y:auto;scrollbar-width:none;padding:0 16px 20px}
.scroll::-webkit-scrollbar{display:none}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 22px}
.ck{position:relative;width:176px;height:176px;display:grid;place-items:center;border-radius:50%}
.ck .shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ck .shape path{fill:var(--pri);transition:d .5s cubic-bezier(.3,.9,.3,1),fill .3s}
.ck>.ms{position:relative;font-size:60px;color:var(--onPri);transition:color .3s}
.ck.busy .shape{animation:spin 5s linear infinite}
.ck.busy .shape path{fill:var(--priC)}
.ck.busy>.ms{color:var(--onPriC)}
.ck.warn .shape path{fill:var(--warnC)}
.ck.warn>.ms{color:var(--onWarnC)}
.ck.off .shape path{fill:var(--sfHH)}
.ck.off>.ms{color:var(--onV)}
.hstate{margin-top:18px;font:500 28px/1.2 var(--ui)}
.hsub{margin-top:6px;font-size:14px;color:var(--onV)}
.fbtn{display:inline-flex;align-items:center;gap:8px;height:40px;margin-top:16px;padding:0 20px 0 16px;border-radius:20px;background:var(--pri);color:var(--onPri);font:500 14px var(--ui)}
.fbtn .ms{font-size:18px}
.group{margin-bottom:16px}
.ghead{display:flex;align-items:center;min-height:36px;padding:0 4px 4px;font:500 14px/20px var(--ui);color:var(--pri)}
.tlink{display:inline-flex;align-items:center;min-height:40px;padding:0 8px;font:500 14px var(--ui);color:var(--pri)}
.item{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 16px;margin-bottom:2px;background:var(--sfC);border-radius:6px}
.item.first{border-radius:22px 22px 6px 6px}
.item.last{border-radius:6px 6px 22px 22px;margin-bottom:0}
.item.sel{background:var(--priC);color:var(--onPriC)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sfHH);color:var(--onV);flex:none}
.av .ms{font-size:22px}
.av.pri{background:var(--pri);color:var(--onPri)}
.item .g{flex:1;min-width:0}
.item b{display:block;font:500 14.5px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;margin-top:2px;font-size:13px;color:var(--onV)}
.item.sel small{color:var(--onPriC);opacity:.78}
.badge{font:500 12px/1 var(--ui);padding:7px 10px;border-radius:999px;background:var(--okC);color:var(--onOkC);white-space:nowrap;flex:none}
.badge.warn{background:var(--warnC);color:var(--onWarnC)}
.badge.idle{background:var(--sfHH);color:var(--onV)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:140px;padding:16px;min-width:0;text-align:left}
.tc.ter{background:var(--terC);color:var(--onTerC);border-radius:28px 28px 28px 10px}
.tc.sec{background:var(--secC);color:var(--onSecC);border-radius:28px 28px 10px 28px}
.tc>.ms{margin-bottom:auto}
.tc .k{margin-top:16px;font:500 13px var(--ui);opacity:.78}
.tc .v{font:500 26px/1.15 var(--ui)}
.tc .v.sm{margin:6px 0 2px;font:500 14px/1.3 var(--mono);overflow-wrap:anywhere}
.tc .d{font:400 12px var(--mono);opacity:.78}
.nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--sfC);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:12px 0 16px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 12px/16px var(--ui);color:var(--onV)}
.nav .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center}
.nav a.on{color:var(--on);font-weight:700}
.nav a.on .pill{background:var(--secC);color:var(--onSecC)}
.nav a.on .ms{font-variation-settings:"FILL" 1,"wght" 400}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div class="phone" data-theme="{{theme}}">
  <header class="tbar">
    <h1>Petrel</h1>
    <span class="sp"></span>
    <button class="icb" type="button" aria-label="配置"><span class="ms">description</span></button>
  </header>
  <main class="scroll">
    <section class="hero">
      <button class="{{s.ck}}" type="button" aria-label="{{s.btnLabel}}" onClick="{{toggle}}">
        <svg class="shape" viewBox="0 0 200 200" aria-hidden="true"><path d="{{s.path}}"></path></svg>
        <span class="ms f">power_settings_new</span>
      </button>
      <div class="hstate">{{s.label}}</div>
      <div class="hsub">{{s.sub}}</div>
      <sc-if value="{{s.login}}" hint-placeholder-val="{{ false }}">
        <a class="fbtn" href="TonalTailnet.dc.html"><span class="ms">login</span>去登录 tailnet</a>
      </sc-if>
    </section>

    <sc-if value="{{s.chain}}" hint-placeholder-val="{{ true }}">
      <section class="group">
        <div class="ghead">当前链路<span class="sp"></span><a class="tlink" href="TonalNodes.dc.html">切换出口</a></div>
        <div class="item first"><span class="av"><span class="ms">lan</span></span><div class="g"><b>ts</b><small>tailnet 第一跳</small></div></div>
        <div class="item"><span class="av"><span class="ms">swap_horiz</span></span><div class="g"><b>tc-u-se-ss-front</b><small>代理前置</small></div></div>
        <a class="item last sel" href="TonalNodes.dc.html"><span class="av pri"><span class="ms f">public</span></span><div class="g"><b>us-lax-ntt-via-tcuse</b><small>出口 · PROXY</small></div><span class="{{s.badge}}">{{s.latText}}</span></a>
      </section>
    </sc-if>

    <section class="duo">
      <a class="tc ter" href="TonalTailnet.dc.html">
        <span class="ms">hub</span>
        <span class="k">tailnet</span>
        <span class="v">{{s.tv}}</span>
        <span class="d">{{s.td}}</span>
      </a>
      <button class="tc sec" type="button">
        <span class="ms">description</span>
        <span class="k">配置</span>
        <span class="v sm">op12.local.yaml</span>
        <span class="d">10月2日导入</span>
      </button>
    </section>
  </main>
  <nav class="nav" aria-label="主导航">
    <a class="on" href="TonalHome.dc.html"><span class="pill"><span class="ms">power_settings_new</span></span>连接</a>
    <a href="TonalNodes.dc.html"><span class="pill"><span class="ms">route</span></span>节点</a>
    <a href="TonalTailnet.dc.html"><span class="pill"><span class="ms">hub</span></span>tailnet</a>
  </nav>
</div>
</x-dc>
