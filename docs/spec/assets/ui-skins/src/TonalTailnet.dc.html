<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Tonal tailnet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&amp;display=block">
<style>
body{margin:0}
.phone{--pri:#415F91;--onPri:#FFFFFF;--priC:#D6E3FF;--onPriC:#001B3E;--secC:#DAE2F9;--onSecC:#131C2B;--sf:#F9F9FF;--sfC:#EDEDF4;--sfHH:#E2E2E9;--on:#191C20;--onV:#44474E;--outV:#C4C6D0;--okC:#C2EFCB;--onOkC:#0A3A1E;--warnC:#FFDEA6;--onWarnC:#3A2800;--chipBg:rgba(255,255,255,.6);--ui:"Google Sans Flex","Outfit","Noto Sans SC",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;width:390px;height:844px;position:relative;overflow:hidden;background:var(--sf);color:var(--on);font-family:var(--ui);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.phone[data-theme="dark"]{--pri:#AAC7FF;--onPri:#0A305F;--priC:#284777;--onPriC:#D6E3FF;--secC:#3E4759;--onSecC:#DAE2F9;--sf:#111318;--sfC:#1D2024;--sfHH:#33353A;--on:#E2E2E9;--onV:#C4C6D0;--outV:#44474E;--okC:#1E5132;--onOkC:#BDEFC9;--warnC:#5C4300;--onWarnC:#FFDEA6;--chipBg:rgba(0,0,0,.22)}
.phone *{box-sizing:border-box}
:where(.phone) a{color:inherit;text-decoration:none}
:where(.phone) button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 400;user-select:none;flex:none}
.ms.f{font-variation-settings:"FILL" 1,"wght" 400}
.tbar{height:64px;display:flex;align-items:center;gap:4px;padding:0 16px 0 20px}
.tbar h1{margin:0;font:500 28px/1.2 var(--ui)}
.sp{flex:1}
.schip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:8px;background:var(--okC);color:var(--onOkC);font:500 13px var(--ui)}
.schip .ms{font-size:18px}
.scroll{position:absolute;left:0;right:0;top:64px;bottom:80px;overflow-y:auto;scrollbar-width:none;padding:0 16px 20px}
.scroll::-webkit-scrollbar{display:none}
.selfc{background:var(--priC);color:var(--onPriC);border-radius:28px;padding:18px;margin-bottom:16px}
.sr{display:flex;align-items:center;gap:14px}
.bigav{width:56px;height:56px;border-radius:18px;background:var(--pri);color:var(--onPri);display:grid;place-items:center;flex:none}
.bigav .ms{font-size:28px}
.sr .g{flex:1;min-width:0}
.sn{font:500 20px/1.25 var(--mono)}
.sip{margin-top:2px;font:400 14px var(--mono);opacity:.8;font-variant-numeric:tabular-nums}
.icb2{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--onPriC)}
.chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:10px;background:var(--chipBg);font:400 13px var(--ui)}
.chip b{font-weight:600;font-variant-numeric:tabular-nums}
.obtn{display:inline-flex;align-items:center;gap:8px;height:40px;margin-top:16px;padding:0 20px 0 16px;border-radius:20px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--onPriC) 40%,transparent);color:var(--onPriC);font:500 14px var(--ui)}
.obtn .ms{font-size:18px}
.group{margin-bottom:12px}
.ghead{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 4px 4px;font:500 14px/20px var(--ui);color:var(--pri)}
.gmeta{font:500 12px var(--ui);color:var(--onV)}
.item{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 16px;margin-bottom:2px;background:var(--sfC);border-radius:6px}
.item.first{border-radius:22px 22px 6px 6px}
.item.last{border-radius:6px 6px 22px 22px;margin-bottom:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--secC);color:var(--onSecC);flex:none}
.av .ms{font-size:22px}
.item.off .av{background:var(--sfHH);color:var(--onV)}
.item .g{flex:1;min-width:0}
.item b{display:block;font:500 14.5px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.off b{color:var(--onV)}
.item small{display:block;margin-top:2px;font:400 12.5px var(--mono);color:var(--onV);font-variant-numeric:tabular-nums}
.badge{font:500 12px/1 var(--ui);padding:7px 10px;border-radius:999px;background:var(--okC);color:var(--onOkC);white-space:nowrap;flex:none}
.badge.warn{background:var(--warnC);color:var(--onWarnC)}
.badge.idle{background:var(--sfHH);color:var(--onV)}
.nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--sfC);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:12px 0 16px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 12px/16px var(--ui);color:var(--onV)}
.nav .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center}
.nav a.on{color:var(--on);font-weight:700}
.nav a.on .pill{background:var(--secC);color:var(--onSecC)}
.nav a.on .ms{font-variation-settings:"FILL" 1,"wght" 400}
</style>
</helmet>
<div class="phone" data-theme="{{theme}}">
  <header class="tbar">
    <h1>tailnet</h1>
    <span class="sp"></span>
    <span class="schip"><span class="ms f">check_circle</span>已连接</span>
  </header>
  <main class="scroll">
    <section class="selfc">
      <div class="sr">
        <span class="bigav"><span class="ms f">smartphone</span></span>
        <div class="g"><div class="sn">op12-petrel</div><div class="sip">100.64.0.20</div></div>
        <button class="icb2" type="button" aria-label="复制地址"><span class="ms">content_copy</span></button>
      </div>
      <div class="chips">
        <span class="chip"><b>5/6</b>在线</span>
        <span class="chip"><b>4</b>直连</span>
        <span class="chip"><b>1</b>中继</span>
      </div>
      <button class="obtn" type="button"><span class="ms">logout</span>登出</button>
    </section>

    <section class="group">
      <div class="ghead">节点<span class="sp"></span><span class="gmeta">5 / 6 在线</span></div>
      <sc-for list="{{peers}}" as="p" hint-placeholder-count="6">
        <div class="{{p.cls}}">
          <span class="av"><span class="ms">{{p.os}}</span></span>
          <div class="g"><b>{{p.name}}</b><small>{{p.ip}}</small></div>
          <span class="{{p.badge}}">{{p.path}}</span>
        </div>
      </sc-for>
    </section>
  </main>
  <nav class="nav" aria-label="主导航">
    <a href="TonalHome.dc.html"><span class="pill"><span class="ms">power_settings_new</span></span>连接</a>
    <a href="TonalNodes.dc.html"><span class="pill"><span class="ms">route</span></span>节点</a>
    <a class="on" href="TonalTailnet.dc.html"><span class="pill"><span class="ms">hub</span></span>tailnet</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [
      ['hu', '100.64.0.11', 'dns', '直连', ''],
      ['keystone', '100.64.0.12', 'laptop', '直连', ''],
      ['mba', '100.64.0.13', 'laptop_mac', '直连', ''],
      ['tc-u-se', '100.64.0.14', 'dns', '直连', ''],
      ['hmm', '100.64.0.15', 'dns', '中继 · hkg', ' warn'],
      ['op12', '100.64.0.9', 'smartphone', '离线', ' idle']
    ];
    const peers = P.map(([name, ip, os, path, band], i) => ({
      name, ip, os, path,
      badge: 'badge' + band,
      cls: 'item' + (i === 0 ? ' first' : i === P.length - 1 ? ' last' : '') + (band === ' idle' ? ' off' : '')
    }));
    return { theme: this.props.dark ? 'dark' : 'light', peers };
  }
}
</script>
</body>
</html>
