<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>夜航 tailnet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.phone{--bg:#0A0F17;--p1:#0F1722;--p2:#162130;--line:#213045;--ink:#E6EDF5;--ink2:#97A6BA;--ink3:#72839A;--ok:#4ADE9A;--okBg:rgba(74,222,154,.12);--warn:#F4B34C;--warnBg:rgba(244,179,76,.13);--err:#FF7B6E;--ui:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;--disp:"Barlow Condensed","IBM Plex Sans","Noto Sans SC",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.phone[data-theme="light"]{--bg:#E8EDF2;--p1:#FFFFFF;--p2:#EEF2F7;--line:#D3DCE6;--ink:#0B1524;--ink2:#46566C;--ink3:#66768C;--ok:#0B7A49;--okBg:rgba(11,122,73,.10);--warn:#985600;--warnBg:rgba(152,86,0,.10);--err:#B42E22}
.phone *{box-sizing:border-box}
:where(.phone) a{color:inherit;text-decoration:none}
:where(.phone) button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{height:60px;display:flex;align-items:center;gap:8px;padding:0 16px 0 20px}
.title{margin:0;font:600 28px/1 var(--disp);letter-spacing:.03em}
.sp{flex:1}
.mono{font-family:var(--mono)}
.t3{font-size:11px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;font:500 11px/1 var(--ui);white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--okBg)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.scroll{position:absolute;left:0;right:0;top:60px;bottom:64px;overflow-y:auto;scrollbar-width:none;padding:2px 12px 20px}
.scroll::-webkit-scrollbar{display:none}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.cap{display:flex;align-items:center;gap:6px;font:500 11px/1 var(--ui);letter-spacing:.06em;color:var(--ink3)}
.cap .en{font:500 9.5px/1 var(--mono);letter-spacing:.16em}
.ghead{display:flex;align-items:baseline;gap:8px;margin:14px 6px 8px}
.gname{font:600 18px/1 var(--disp);letter-spacing:.06em}
.foot{margin:0 6px 8px;font-size:11.5px;line-height:1.5;color:var(--ink3)}
.self{padding:16px}
.selfname{margin-top:12px;font:500 24px/1.2 var(--mono)}
.iprow{display:flex;align-items:center;gap:2px;margin-top:2px}
.ip{font:400 14px var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.icb{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.icb .ic{width:17px;height:17px}
.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:10px -16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.reads>div{padding:12px 16px}
.reads>div+div{border-left:1px solid var(--line)}
.reads .v{font:500 30px/1 var(--disp);font-variant-numeric:tabular-nums}
.reads .v small{font:500 15px var(--disp);color:var(--ink2);margin-left:1px}
.reads .v.ok{color:var(--ok)}.reads .v.warn{color:var(--warn)}
.reads .k{margin-top:6px;font-size:11px;color:var(--ink3)}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;margin-top:16px;border:1px solid var(--line);border-radius:10px;font:500 14px var(--ui);color:var(--ink)}
.ghost .ic{width:18px;height:18px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 16px;border-top:1px solid var(--line)}
.prow.first{border-top:0}
.prow .g{flex:1;min-width:0}
.prow b{display:block;font:500 14px/1.3 var(--mono)}
.prow small{display:block;margin-top:2px;font:400 11.5px var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
.prow.off b{color:var(--ink2)}
.dotk{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.prow.off .dotk{background:transparent;border:1.5px solid var(--ink3)}
.path{font:500 11.5px/1 var(--ui);padding:5px 8px;border-radius:6px;white-space:nowrap}
.path.ok{color:var(--ok);background:var(--okBg)}.path.warn{color:var(--warn);background:var(--warnBg)}.path.idle{color:var(--ink3);box-shadow:inset 0 0 0 1px var(--line)}
.dock{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--p1);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.dock a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:500 11px/1 var(--ui);color:var(--ink3)}
.dock a .ic{width:22px;height:22px}
.dock a.on{color:var(--ink)}
.dock a.on::before{content:"";position:absolute;top:-1px;left:50%;width:32px;height:2px;margin-left:-16px;background:var(--ok);border-radius:0 0 2px 2px}
</style>
</helmet>
<div class="phone" data-theme="{{theme}}">
  <header class="top">
    <h1 class="title">tailnet</h1>
    <span class="sp"></span>
    <span class="chip ok"><span class="dot"></span>已连接</span>
  </header>
  <main class="scroll">
    <section class="panel self">
      <div class="cap">本机 <span class="en">SELF</span></div>
      <div class="selfname">op12-petrel</div>
      <div class="iprow">
        <span class="ip">100.64.0.20</span>
        <button class="icb" type="button" aria-label="复制地址"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button>
      </div>
      <div class="reads">
        <div><div class="v">5<small>/6</small></div><div class="k">在线</div></div>
        <div><div class="v ok">4</div><div class="k">直连</div></div>
        <div><div class="v warn">1</div><div class="k">中继</div></div>
      </div>
      <button class="ghost" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l-5-5 5-5M5 12h11"></path></svg>登出</button>
    </section>

    <div class="ghead"><span class="gname">节点</span><span class="mono t3">PEERS</span><span class="sp"></span><span class="t3">5 / 6 在线</span></div>
    <section class="panel">
      <sc-for list="{{peers}}" as="p" hint-placeholder-count="6">
        <div class="{{p.rowCls}}">
          <span class="dotk"></span>
          <div class="g"><b>{{p.name}}</b><small>{{p.ip}}</small></div>
          <span class="{{p.pathCls}}">{{p.path}}</span>
        </div>
      </sc-for>
    </section>
    <p class="foot">长按节点复制地址。直连是点对点 WireGuard，中继经 DERP 转发。</p>
  </main>
  <nav class="dock" aria-label="主导航">
    <a href="NightHome.dc.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v8"></path><path d="M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg>连接</a>
    <a href="NightNodes.dc.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="5.5" cy="6" r="1.8"></circle><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="5.5" cy="18" r="1.8"></circle><path d="M10 6h10M10 12h10M10 18h10"></path></svg>节点</a>
    <a class="on" href="NightTailnet.dc.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"></circle><circle cx="5" cy="18" r="2.2"></circle><circle cx="19" cy="18" r="2.2"></circle><path d="M11 7 6 16M13 7l5 9M7.2 18h9.6"></path></svg>tailnet</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [
      ['hu', '100.64.0.11', '直连', 'ok'],
      ['keystone', '100.64.0.12', '直连', 'ok'],
      ['mba', '100.64.0.13', '直连', 'ok'],
      ['tc-u-se', '100.64.0.14', '直连', 'ok'],
      ['hmm', '100.64.0.15', '中继 · hkg', 'warn'],
      ['op12', '100.64.0.9', '离线', 'idle']
    ];
    const peers = P.map(([name, ip, path, band], i) => ({
      name, ip, path,
      pathCls: 'path ' + band,
      rowCls: 'prow' + (i === 0 ? ' first' : '') + (band === 'idle' ? ' off' : '')
    }));
    const dark = this.props.dark ?? true;
    return { theme: dark ? 'dark' : 'light', peers };
  }
}
</script>
</body>
</html>
