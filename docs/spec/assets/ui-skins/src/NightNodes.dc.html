<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>夜航 节点</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.phone{--bg:#0A0F17;--p1:#0F1722;--p2:#162130;--line:#213045;--ink:#E6EDF5;--ink2:#97A6BA;--ink3:#72839A;--ok:#4ADE9A;--okBg:rgba(74,222,154,.12);--warn:#F4B34C;--warnBg:rgba(244,179,76,.13);--err:#FF7B6E;--ui:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;--disp:"Barlow Condensed","IBM Plex Sans","Noto Sans SC",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.phone[data-theme="light"]{--bg:#E8EDF2;--p1:#FFFFFF;--p2:#EEF2F7;--line:#D3DCE6;--ink:#0B1524;--ink2:#46566C;--ink3:#66768C;--ok:#0B7A49;--okBg:rgba(11,122,73,.10);--warn:#985600;--warnBg:rgba(152,86,0,.10);--err:#B42E22}
.phone *{box-sizing:border-box}
:where(.phone) a{color:inherit;text-decoration:none}
:where(.phone) button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{height:60px;display:flex;align-items:center;gap:8px;padding:0 12px 0 20px}
.title{margin:0;font:600 28px/1 var(--disp);letter-spacing:.03em}
.sp{flex:1}
.mono{font-family:var(--mono)}
.t3{font-size:11px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;font:500 11px/1 var(--ui);white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--okBg)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.obtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--p1);font:500 13px var(--ui);color:var(--ink)}
.obtn .ic{width:16px;height:16px}
.scroll{position:absolute;left:0;right:0;top:60px;bottom:64px;overflow-y:auto;scrollbar-width:none;padding:0 12px 20px}
.scroll::-webkit-scrollbar{display:none}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ghead{display:flex;align-items:baseline;gap:8px;margin:12px 6px 8px}
.gname{font:600 18px/1 var(--disp);letter-spacing:.06em}
.foot{margin:0 6px 8px;font-size:11.5px;line-height:1.5;color:var(--ink3)}
.nrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px 14px 16px;border-top:1px solid var(--line)}
.nrow.first{border-top:0}
.nrow.sel{background:var(--p2)}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink3);display:grid;place-items:center;flex:none}
.nrow.sel .radio{border-color:var(--ok)}
.nrow.sel .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.nrow .g{flex:1;min-width:0}
.nrow b{display:block;font:500 13.5px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow.sel b{font-weight:600}
.nrow small{display:block;margin-top:3px;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:flex-end;gap:2px;height:14px;flex:none}
.meter i{width:3px;border-radius:1px;background:var(--line)}
.meter i:nth-child(1){height:5px}.meter i:nth-child(2){height:8px}.meter i:nth-child(3){height:11px}.meter i:nth-child(4){height:14px}
.meter.ok i.f{background:var(--ok)}.meter.warn i.f{background:var(--warn)}.meter.bad i.f{background:var(--err)}
.msv{font:500 24px/1 var(--disp);font-variant-numeric:tabular-nums;min-width:52px;text-align:right;flex:none}
.msv small{font:500 10px var(--mono);color:var(--ink2);margin-left:2px}
.msv.idle{color:var(--ink3)}
.dotk{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink3);flex:none;margin:0 5px}
.dotk.ok{border:0;background:var(--ok)}
.dock{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--p1);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.dock a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:500 11px/1 var(--ui);color:var(--ink3)}
.dock a .ic{width:22px;height:22px}
.dock a.on{color:var(--ink)}
.dock a.on::before{content:"";position:absolute;top:-1px;left:50%;width:32px;height:2px;margin-left:-16px;background:var(--ok);border-radius:0 0 2px 2px}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div class="phone" data-theme="{{theme}}">
  <header class="top">
    <h1 class="title">节点</h1>
    <span class="sp"></span>
    <button class="obtn" type="button" onClick="{{test}}"><svg class="{{testIc}}" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5M9 2.5h6"></path></svg>{{testLabel}}</button>
  </header>
  <main class="scroll">
    <div class="ghead"><span class="gname">PROXY</span><span class="mono t3">SELECT · 2</span><span class="sp"></span><span class="t3">手动选择</span></div>
    <section class="panel" role="radiogroup" aria-label="PROXY">
      <sc-for list="{{nodes}}" as="n" hint-placeholder-count="2">
        <button class="{{n.rowCls}}" type="button" role="radio" aria-checked="{{n.on}}" onClick="{{n.pick}}">
          <span class="radio"></span>
          <div class="g"><b>{{n.name}}</b><small>{{n.sub}}</small></div>
          <span class="{{n.meterCls}}"><sc-for list="{{n.bars}}" as="bar" hint-placeholder-count="4"><i class="{{bar.c}}"></i></sc-for></span>
          <span class="{{n.msCls}}">{{n.lat}}<small>{{n.unit}}</small></span>
        </button>
      </sc-for>
    </section>
    <p class="foot">切换后会断开经过 PROXY 的现有连接，立刻生效。</p>

    <div class="ghead"><span class="gname">链路底座</span><span class="mono t3">BASE</span><span class="sp"></span><span class="t3">不参与切换</span></div>
    <section class="panel">
      <div class="nrow first">
        <span class="dotk ok"></span>
        <div class="g"><b>ts</b><small>tailnet 第一跳 · Petrel 注入</small></div>
        <span class="chip ok"><span class="dot"></span>已连接</span>
      </div>
      <div class="nrow">
        <span class="dotk"></span>
        <div class="g"><b>tc-u-se-ss-front</b><small>代理前置 · 不在任何 select 组里</small></div>
      </div>
    </section>
    <p class="foot">配置里有多个 select 组时，每组一块面板，顺序同配置文件。</p>
  </main>
  <nav class="dock" aria-label="主导航">
    <a href="NightHome.dc.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v8"></path><path d="M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg>连接</a>
    <a class="on" href="NightNodes.dc.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="5.5" cy="6" r="1.8"></circle><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="5.5" cy="18" r="1.8"></circle><path d="M10 6h10M10 12h10M10 18h10"></path></svg>节点</a>
    <a href="NightTailnet.dc.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"></circle><circle cx="5" cy="18" r="2.2"></circle><circle cx="19" cy="18" r="2.2"></circle><path d="M11 7 6 16M13 7l5 9M7.2 18h9.6"></path></svg>tailnet</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const st = this.state || {};
    const sel = st.sel || 'us-lax-ntt-via-tcuse';
    const testing = !!st.testing;
    const nodes = [
      { name: 'us-lax-ntt-via-tcuse', d: 182 },
      { name: 'tokyo-iij-via-tcuse', d: 96 }
    ].map((n, i) => {
      const on = n.name === sel;
      const band = n.d < 100 ? 'ok' : n.d < 200 ? 'warn' : 'bad';
      const fill = n.d < 100 ? 4 : n.d < 200 ? 3 : n.d < 400 ? 2 : 1;
      return {
        name: n.name,
        on: on ? 'true' : 'false',
        sub: '经 tc-u-se-ss-front → ts',
        rowCls: 'nrow' + (i === 0 ? ' first' : '') + (on ? ' sel' : ''),
        meterCls: 'meter ' + (testing ? 'idle' : band),
        bars: [0, 1, 2, 3].map((k) => ({ c: !testing && k < fill ? 'f' : '' })),
        lat: testing ? '…' : String(n.d),
        unit: testing ? '' : 'ms',
        msCls: testing ? 'msv idle' : 'msv',
        pick: () => this.setState({ sel: n.name })
      };
    });
    const test = () => {
      if (testing) return;
      this.setState({ testing: true });
      clearTimeout(this._t);
      this._t = setTimeout(() => this.setState({ testing: false }), 1500);
    };
    const dark = this.props.dark ?? true;
    return {
      theme: dark ? 'dark' : 'light',
      nodes,
      test,
      testLabel: testing ? '测速中' : '测延迟',
      testIc: testing ? 'ic spin' : 'ic'
    };
  }
}
</script>
</body>
</html>
