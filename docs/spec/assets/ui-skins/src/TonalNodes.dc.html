<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Tonal 节点</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&amp;display=block">
<style>
body{margin:0}
.phone{--pri:#415F91;--onPri:#FFFFFF;--priC:#D6E3FF;--onPriC:#001B3E;--secC:#DAE2F9;--onSecC:#131C2B;--sf:#F9F9FF;--sfC:#EDEDF4;--sfHH:#E2E2E9;--on:#191C20;--onV:#44474E;--outV:#C4C6D0;--okC:#C2EFCB;--onOkC:#0A3A1E;--warnC:#FFDEA6;--onWarnC:#3A2800;--ui:"Google Sans Flex","Outfit","Noto Sans SC",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;width:390px;height:844px;position:relative;overflow:hidden;background:var(--sf);color:var(--on);font-family:var(--ui);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
.phone[data-theme="dark"]{--pri:#AAC7FF;--onPri:#0A305F;--priC:#284777;--onPriC:#D6E3FF;--secC:#3E4759;--onSecC:#DAE2F9;--sf:#111318;--sfC:#1D2024;--sfHH:#33353A;--on:#E2E2E9;--onV:#C4C6D0;--outV:#44474E;--okC:#1E5132;--onOkC:#BDEFC9;--warnC:#5C4300;--onWarnC:#FFDEA6}
.phone *{box-sizing:border-box}
:where(.phone) a{color:inherit;text-decoration:none}
:where(.phone) button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 400;user-select:none;flex:none}
.ms.f{font-variation-settings:"FILL" 1,"wght" 400}
.tbar{height:64px;display:flex;align-items:center;gap:4px;padding:0 4px 0 20px}
.tbar h1{margin:0;font:500 28px/1.2 var(--ui)}
.scroll{position:absolute;left:0;right:0;top:64px;bottom:80px;overflow-y:auto;scrollbar-width:none;padding:0 16px 96px}
.scroll::-webkit-scrollbar{display:none}
.group{margin-bottom:8px}
.ghead{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 4px 4px;font:500 14px/20px var(--ui);color:var(--pri)}
.chipm{height:24px;padding:0 8px;border-radius:8px;display:inline-flex;align-items:center;font:500 12px var(--ui);color:var(--onV);box-shadow:inset 0 0 0 1px var(--outV)}
.item{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 16px;margin-bottom:2px;background:var(--sfC);border-radius:6px}
.item.first{border-radius:22px 22px 6px 6px}
.item.last{border-radius:6px 6px 22px 22px;margin-bottom:0}
.item.sel{background:var(--priC);color:var(--onPriC)}
.rd{color:var(--onV)}
.rd.on{color:var(--pri)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sfHH);color:var(--onV);flex:none}
.av .ms{font-size:22px}
.item .g{flex:1;min-width:0}
.item b{display:block;font:500 14.5px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;margin-top:2px;font-size:13px;color:var(--onV);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.sel small{color:var(--onPriC);opacity:.78}
.badge{font:500 12px/1 var(--ui);padding:7px 10px;border-radius:999px;background:var(--okC);color:var(--onOkC);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.badge.warn{background:var(--warnC);color:var(--onWarnC)}
.badge.idle{background:var(--sfHH);color:var(--onV)}
.foot{margin:8px 4px 16px;font-size:12.5px;line-height:1.5;color:var(--onV)}
.efab{position:absolute;right:16px;bottom:96px;height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--priC);color:var(--onPriC);display:flex;align-items:center;gap:12px;font:500 16px var(--ui);box-shadow:0 4px 8px 3px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.22);z-index:4}
.nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--sfC);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:12px 0 16px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 12px/16px var(--ui);color:var(--onV)}
.nav .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center}
.nav a.on{color:var(--on);font-weight:700}
.nav a.on .pill{background:var(--secC);color:var(--onSecC)}
.nav a.on .ms{font-variation-settings:"FILL" 1,"wght" 400}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div class="phone" data-theme="{{theme}}">
  <header class="tbar"><h1>节点</h1></header>
  <main class="scroll">
    <section class="group" role="radiogroup" aria-label="PROXY">
      <div class="ghead">PROXY<span class="chipm">select · 2</span></div>
      <sc-for list="{{nodes}}" as="n" hint-placeholder-count="2">
        <button class="{{n.cls}}" type="button" role="radio" aria-checked="{{n.on}}" onClick="{{n.pick}}">
          <span class="{{n.rdCls}}">{{n.rd}}</span>
          <div class="g"><b>{{n.name}}</b><small>经 tc-u-se-ss-front → ts</small></div>
          <span class="{{n.badge}}">{{n.lat}}</span>
        </button>
      </sc-for>
    </section>
    <p class="foot">切换后会断开经过 PROXY 的现有连接，立刻生效。</p>

    <section class="group">
      <div class="ghead">链路底座<span class="chipm">不参与切换</span></div>
      <div class="item first">
        <span class="av"><span class="ms">lan</span></span>
        <div class="g"><b>ts</b><small>tailnet 第一跳 · Petrel 注入</small></div>
        <span class="badge">已连接</span>
      </div>
      <div class="item last">
        <span class="av"><span class="ms">swap_horiz</span></span>
        <div class="g"><b>tc-u-se-ss-front</b><small>代理前置 · 不在任何 select 组里</small></div>
      </div>
    </section>
    <p class="foot">配置里有多个 select 组时，每组一段分组列表，顺序同配置文件。</p>
  </main>
  <button class="efab" type="button" onClick="{{test}}"><span class="{{testIc}}">timer</span>{{testLabel}}</button>
  <nav class="nav" aria-label="主导航">
    <a href="TonalHome.dc.html"><span class="pill"><span class="ms">power_settings_new</span></span>连接</a>
    <a class="on" href="TonalNodes.dc.html"><span class="pill"><span class="ms">route</span></span>节点</a>
    <a href="TonalTailnet.dc.html"><span class="pill"><span class="ms">hub</span></span>tailnet</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const st = this.state || {};
    const sel = st.sel || 'us-lax-ntt-via-tcuse';
    const testing = !!st.testing;
    const list = [
      { name: 'us-lax-ntt-via-tcuse', d: 182 },
      { name: 'tokyo-iij-via-tcuse', d: 96 }
    ];
    const nodes = list.map((n, i) => {
      const on = n.name === sel;
      const band = n.d < 100 ? '' : ' warn';
      const pos = i === 0 ? ' first' : i === list.length - 1 ? ' last' : '';
      return {
        name: n.name,
        on: on ? 'true' : 'false',
        cls: 'item' + pos + (on ? ' sel' : ''),
        rd: on ? 'radio_button_checked' : 'radio_button_unchecked',
        rdCls: on ? 'ms f rd on' : 'ms rd',
        lat: testing ? '…' : n.d + ' ms',
        badge: testing ? 'badge idle' : 'badge' + band,
        pick: () => this.setState({ sel: n.name })
      };
    });
    const test = () => {
      if (testing) return;
      this.setState({ testing: true });
      clearTimeout(this._t);
      this._t = setTimeout(() => this.setState({ testing: false }), 1500);
    };
    return { theme: this.props.dark ? 'dark' : 'light', nodes, test, testLabel: testing ? '测速中' : '测延迟', testIc: testing ? 'ms spin' : 'ms' };
  }
}
</script>
</body>
</html>
