<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Shoal 节点</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&amp;family=Rubik:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&amp;display=block">
<style>
body{margin:0}
.phone{--wall:#E9E1D3;--sf:#FEF6EE;--sf2:#F6ECDF;--sf3:#ECE0CF;--tx:#2A2217;--tx2:#8A7C65;--hair:#EADFCF;--em:#B1A48E;--ol:#705A0F;--onol:#FFF6E0;--gold:#D4B35B;--butter:#F6DE96;--butterInk:#2A1800;--brown:#665A42;--brownInk:#F2E6CF;--sage:#4E604E;--sageInk:#DCEADA;--mint:#CCEAC6;--mintInk:#1F3B22;--red:#B4181E;--redInk:#FFF1EC;--pink:#F4C9C4;--pinkInk:#6B0F12;--knob:#B7AA95;--shIsle:0 16px 32px -18px rgba(70,48,18,.40),0 2px 6px rgba(70,48,18,.10),0 0 0 .5px rgba(70,48,18,.08);--shPill:0 2px 3px -1px rgba(70,48,18,.38),0 0 0 .5px rgba(70,48,18,.07);--ui:"Rubik","Noto Sans SC","PingFang SC",system-ui,sans-serif;--disp:"Oswald","Rubik","Noto Sans SC",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;width:390px;height:844px;position:relative;overflow:hidden;background:var(--wall);color:var(--tx);font-family:var(--ui);font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased}
.phone[data-theme="dark"]{--wall:#14120E;--sf:#221E18;--sf2:#2B261E;--sf3:#383126;--tx:#EDE4D6;--tx2:#A3977F;--hair:#302A21;--em:#7C715F;--ol:#D4B35B;--onol:#2A1800;--gold:#D4B35B;--butter:#4A3E1E;--butterInk:#F6DE96;--brown:#6B5E45;--brownInk:#F2E6CF;--sage:#4E604E;--sageInk:#DCEADA;--mint:#2C4230;--mintInk:#CCEAC6;--red:#9E2A2E;--redInk:#FFF1EC;--pink:#4A2422;--pinkInk:#F4C9C4;--knob:#7C715F;--shIsle:0 16px 32px -18px rgba(0,0,0,.75),0 0 0 .5px rgba(255,240,210,.07);--shPill:0 2px 4px -1px rgba(0,0,0,.6),0 0 0 .5px rgba(255,240,210,.07)}
.phone *{box-sizing:border-box}
:where(.phone) a{color:inherit;text-decoration:none}
:where(.phone) button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 500;user-select:none;flex:none}
.ms.f{font-variation-settings:"FILL" 1,"wght" 500}
.appbar{height:56px;display:flex;align-items:center;gap:8px;padding:0 14px 0 18px}
.appbar h1{margin:0;font:600 20px/1.2 var(--ui);letter-spacing:.01em}
.sp{flex:1}
.scroll{position:absolute;left:0;right:0;top:56px;bottom:0;overflow-y:auto;scrollbar-width:none;padding:4px 12px 100px}
.scroll::-webkit-scrollbar{display:none}
.tag{font:500 10.5px/1 var(--ui);padding:4px 7px;border-radius:999px;background:var(--sf2);color:var(--tx2);flex:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.live{background:var(--mint);color:var(--mintInk)}
.tag.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#4F9A5B}
.lat{font:500 12px/1 var(--ui);font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:999px;flex:none;white-space:nowrap}
.lat.ok{background:var(--mint);color:var(--mintInk)}.lat.warn{background:var(--butter);color:var(--butterInk)}.lat.bad{background:var(--pink);color:var(--pinkInk)}.lat.idle{background:var(--sf3);color:var(--tx2)}
.lbl{font:600 11px/1 var(--ui);letter-spacing:.08em;color:var(--tx2);margin:16px 6px 8px;display:flex;align-items:center;gap:6px}
.lbl em{font-style:normal;font-weight:500;letter-spacing:.02em;color:var(--em);font-family:var(--mono);font-size:10.5px}
.foot{margin:10px 4px 0;font-size:11.5px;line-height:1.5;color:var(--tx2)}
.mini{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px 0 8px;border-radius:999px;background:var(--sf2);font:500 12px var(--ui);color:var(--tx);flex:none;white-space:nowrap}
.mini .ms{font-size:16px}
.mini.onwall{background:var(--sf);box-shadow:var(--shPill);height:32px;padding:0 12px 0 10px;font-size:12.5px}
.mini.onwall .ms{font-size:17px}
.tile{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.tile .ms{font-size:20px}
.t-brown{background:var(--brown);color:var(--brownInk)}.t-sage{background:var(--sage);color:var(--sageInk)}.t-mint{background:var(--mint);color:var(--mintInk)}
.isle{background:var(--sf);border-radius:24px;padding:14px;box-shadow:var(--shIsle);margin-bottom:12px}
.isle.tight{padding:6px}
.ph{display:flex;align-items:center;gap:10px}
.ph>div{flex:1;min-width:0}
.ph h3{margin:0;font:600 15px/1.25 var(--ui)}
.ph p{margin:2px 0 0;font-size:12px;color:var(--tx2);line-height:1.4}
.card{background:var(--sf2);border-radius:16px;padding:6px;margin-top:12px}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;width:100%}
.row>.ms{font-size:19px;color:var(--tx2)}
.row .g{flex:1;min-width:0}
.row b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--tx2);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.sel{background:var(--butter)}
.row.sel>.ms,.row.sel b{color:var(--butterInk)}
.fnav{position:absolute;left:12px;right:12px;bottom:16px;height:56px;background:var(--sf);border-radius:999px;box-shadow:var(--shIsle);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:5px;z-index:5}
.fnav a{border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font:500 13px var(--ui);color:var(--tx2)}
.fnav a .ms{font-size:21px}
.fnav a.on{background:var(--ol);color:var(--onol)}
.fnav a.on .ms{font-variation-settings:"FILL" 1,"wght" 500}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div class="phone" data-theme="{{theme}}">
  <header class="appbar">
    <h1>节点</h1>
    <span class="sp"></span>
    <button class="mini onwall" type="button" onClick="{{test}}"><span class="{{testIc}}">speed</span>{{testLabel}}</button>
  </header>
  <main class="scroll">
    <section class="isle">
      <div class="ph">
        <span class="tile t-sage"><span class="ms">hub</span></span>
        <div><h3>PROXY</h3><p>手动选择 · 2 个节点</p></div>
        <span class="tag">select</span>
      </div>
      <div class="card">
        <div class="list" role="radiogroup" aria-label="PROXY">
          <sc-for list="{{nodes}}" as="n" hint-placeholder-count="2">
            <button class="{{n.rowCls}}" type="button" role="radio" aria-checked="{{n.on}}" onClick="{{n.pick}}">
              <span class="{{n.icCls}}">{{n.icon}}</span>
              <div class="g"><b>{{n.name}}</b><small>{{n.sub}}</small></div>
              <span class="{{n.latCls}}">{{n.lat}}</span>
            </button>
          </sc-for>
        </div>
      </div>
      <p class="foot">切换后会断开经过 PROXY 的现有连接，立刻生效。</p>
    </section>

    <div class="lbl">链路底座 <em>不参与切换</em></div>
    <section class="isle tight">
      <div class="list">
        <div class="row">
          <span class="tile t-mint"><span class="ms">lan</span></span>
          <div class="g"><b>ts</b><small>tailnet 第一跳 · Petrel 注入</small></div>
          <span class="tag live">已连接</span>
        </div>
        <div class="row">
          <span class="tile t-brown"><span class="ms">swap_horiz</span></span>
          <div class="g"><b>tc-u-se-ss-front</b><small>代理前置 · 不在任何 select 组里</small></div>
        </div>
      </div>
    </section>
    <p class="foot">配置里有多个 select 组时，每组一座浮岛，顺序同配置文件。</p>
  </main>
  <nav class="fnav" aria-label="主导航">
    <a href="Main.dc.html"><span class="ms">power_settings_new</span>连接</a>
    <a class="on" href="ShoalNodes.dc.html"><span class="ms">hub</span>节点</a>
    <a href="ShoalTailnet.dc.html"><span class="ms">lan</span>tailnet</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const st = this.state || {};
    const sel = st.sel || 'us-lax-ntt-via-tcuse';
    const testing = !!st.testing;
    const nodes = [
      { name: 'us-lax-ntt-via-tcuse', d: 182 },
      { name: 'tokyo-iij-via-tcuse', d: 96 }
    ].map((n) => {
      const on = n.name === sel;
      const band = n.d < 100 ? 'ok' : n.d < 200 ? 'warn' : 'bad';
      return {
        name: n.name,
        on: on ? 'true' : 'false',
        sub: '经 tc-u-se-ss-front → ts' + (on ? ' · 当前出站' : ''),
        rowCls: on ? 'row sel' : 'row',
        icon: on ? 'radio_button_checked' : 'radio_button_unchecked',
        icCls: on ? 'ms f' : 'ms',
        lat: testing ? '…' : n.d + ' ms',
        latCls: testing ? 'lat idle' : 'lat ' + band,
        pick: () => this.setState({ sel: n.name })
      };
    });
    const test = () => {
      if (testing) return;
      this.setState({ testing: true });
      clearTimeout(this._t);
      this._t = setTimeout(() => this.setState({ testing: false }), 1500);
    };
    return {
      theme: this.props.dark ? 'dark' : 'light',
      nodes,
      test,
      testLabel: testing ? '测速中' : '测延迟',
      testIc: testing ? 'ms spin' : 'ms'
    };
  }
}
</script>
</body>
</html>
