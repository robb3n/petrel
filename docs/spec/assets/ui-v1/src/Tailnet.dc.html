<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>tailnet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
.pt{--bg:#F2F5F6;--surface:#FFFFFF;--surface-2:#E7ECEE;--ink:#11181C;--ink-2:#4A5761;--line:#D2DADE;--accent:#0C6A76;--on-accent:#FFFFFF;--accent-soft:#D3EBEE;--ok:#1B7346;--warn:#985200;--warn-soft:#F8E8D2;--err:#B3261E;--err-soft:#FBE2DF}
.pt.dark{--bg:#0C1114;--surface:#141B1F;--surface-2:#1D262B;--ink:#E4EAED;--ink-2:#9AA8B0;--line:#28333A;--accent:#61C3CF;--on-accent:#05181B;--accent-soft:#11343A;--ok:#5ECA8F;--warn:#E6A64B;--warn-soft:#33261A;--err:#F28B82;--err-soft:#3A1C1A}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: 'Noto Sans SC', sans-serif; overflow: hidden">
<header style="display: flex; align-items: center; padding: 22px 20px 10px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">tailnet</h1>
</header>
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 6px 16px 16px; min-height: 0">
<section aria-label="本机" style="background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 12.5px; color: var(--ink-2)">本机</span>
<span style="font-size: 12px; font-weight: 500; color: var(--ok); background: var(--surface-2); padding: 4px 10px; border-radius: 12px">已连接</span>
</div>
<div class="mono" style="font-size: 22px; font-weight: 500">op12-petrel</div>
<div style="display: flex; align-items: center; gap: 4px; margin-top: -6px">
<span class="mono" style="font-size: 15px; color: var(--ink-2); flex-grow: 1">100.64.0.20</span>
<button type="button" aria-label="复制地址" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: var(--ink-2); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: 'Noto Sans SC', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 17l-5-5 5-5M5 12h11"></path></svg>登出</button>
</section>
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 4px 4px 0">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">节点</h2>
<span style="font-size: 12.5px; color: var(--ink-2)">5 / 6 在线</span>
</div>
<section aria-label="tailnet 节点" style="background: var(--surface); border: 1px solid var(--line); border-radius: 24px; display: flex; flex-direction: column; padding: 4px 0">
<sc-for list="{{peers}}" as="p" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 8px 18px; box-sizing: border-box; border-top: 1px solid {{p.divider}}">
<span style="width: 10px; height: 10px; border-radius: 5px; box-sizing: border-box; background: {{p.dotBg}}; border: 2px solid {{p.dotBorder}}; flex-shrink: 0"></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span class="mono" style="font-size: 15px; font-weight: 500">{{p.name}}</span>
<span class="mono" style="font-size: 12px; color: var(--ink-2)">{{p.ip}}</span>
</span>
<span style="font-size: 12.5px; font-weight: 500; color: {{p.color}}">{{p.path}}</span>
</div>
</sc-for>
</section>
</main>
<nav aria-label="主导航" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px 8px 26px; background: var(--surface); border-top: 1px solid var(--line)">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; color: var(--ink-2)">
<span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg></span>
<span style="font-size: 12px; font-weight: 500">连接</span>
</a>
<a href="Nodes.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; color: var(--ink-2)">
<span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="6" r="1.8"></circle><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="5.5" cy="18" r="1.8"></circle><path d="M10 6h10M10 12h10M10 18h10"></path></svg></span>
<span style="font-size: 12px; font-weight: 500">节点</span>
</a>
<a href="Tailnet.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; color: var(--ink)">
<span style="width: 64px; height: 32px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.2"></circle><circle cx="5" cy="18" r="2.2"></circle><circle cx="19" cy="18" r="2.2"></circle><path d="M11 7 6 16M13 7l5 9M7.2 18h9.6"></path></svg></span>
<span style="font-size: 12px; font-weight: 700">tailnet</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"主题"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const raw = [
{ name: 'hu', ip: '100.64.0.11', kind: 'direct' },
{ name: 'keystone', ip: '100.64.0.12', kind: 'direct' },
{ name: 'mba', ip: '100.64.0.13', kind: 'direct' },
{ name: 'tc-u-se', ip: '100.64.0.14', kind: 'direct' },
{ name: 'hmm', ip: '100.64.0.15', kind: 'relay', region: 'hkg' },
{ name: 'op12', ip: '100.64.0.9', kind: 'offline' }
];
return {
theme: this.props.dark ? 'pt dark' : 'pt',
peers: raw.map((p, i) => ({
name: p.name,
ip: p.ip,
divider: i === 0 ? 'transparent' : 'var(--line)',
dotBg: p.kind === 'offline' ? 'transparent' : 'var(--ok)',
dotBorder: p.kind === 'offline' ? 'var(--ink-2)' : 'var(--ok)',
color: p.kind === 'direct' ? 'var(--ok)' : (p.kind === 'relay' ? 'var(--warn)' : 'var(--ink-2)'),
path: p.kind === 'direct' ? '直连' : (p.kind === 'relay' ? '中继 · ' + p.region : '离线')
}))
};
}
}
</script>
</body>
</html>
