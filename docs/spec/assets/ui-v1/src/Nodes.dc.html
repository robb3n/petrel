<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>节点</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
.pt{--bg:#F2F5F6;--surface:#FFFFFF;--surface-2:#E7ECEE;--ink:#11181C;--ink-2:#4A5761;--line:#D2DADE;--accent:#0C6A76;--on-accent:#FFFFFF;--accent-soft:#D3EBEE;--ok:#1B7346;--warn:#985200;--warn-soft:#F8E8D2;--err:#B3261E;--err-soft:#FBE2DF}
.pt.dark{--bg:#0C1114;--surface:#141B1F;--surface-2:#1D262B;--ink:#E4EAED;--ink-2:#9AA8B0;--line:#28333A;--accent:#61C3CF;--on-accent:#05181B;--accent-soft:#11343A;--ok:#5ECA8F;--warn:#E6A64B;--warn-soft:#33261A;--err:#F28B82;--err-soft:#3A1C1A}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: 'Noto Sans SC', sans-serif; overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 6px 20px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">节点</h1>
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: 'Noto Sans SC', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5M9 2.5h6"></path></svg>测延迟</button>
</header>
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 16px">
<div style="display: flex; align-items: baseline; gap: 10px; padding: 0 4px">
<h2 class="mono" style="margin: 0; font-size: 18px; font-weight: 500">PROXY</h2>
<span style="font-size: 12.5px; color: var(--ink-2)">手动选择 · 2 个节点</span>
</div>
<div role="group" aria-label="PROXY 组节点" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{nodes}}" as="n" hint-placeholder-count="2">
<button type="button" onClick="{{n.pick}}" aria-pressed="{{n.pressed}}" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 16px; box-sizing: border-box; border-radius: 18px; border: 1.5px solid {{n.border}}; background: {{n.bg}}; color: var(--ink); text-align: left; font-family: 'Noto Sans SC', sans-serif; cursor: pointer">
<span style="width: 20px; height: 20px; border-radius: 10px; border: 2px solid {{n.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{n.dot}}"></span></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span class="mono" style="font-size: 15px; font-weight: 500">{{n.name}}</span>
<span style="font-size: 12px; color: var(--ink-2)">经 tc-u-se-ss-front → ts</span>
</span>
<span class="mono" style="font-size: 14px; color: var(--ok)">{{n.lat}}</span>
</button>
</sc-for>
</div>
<section aria-label="第一跳" style="margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12.5px; color: var(--ink-2)">链路底座（不参与切换）</span>
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span class="mono" style="font-size: 14px; font-weight: 500">ts</span>
<span style="font-size: 12.5px; color: var(--ink-2)">tailnet 第一跳 · Petrel 注入</span>
</span>
<span style="font-size: 12.5px; color: var(--ok); white-space: nowrap; flex-shrink: 0">已连接</span>
</div>
<div style="height: 1px; background: var(--line)"></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span class="mono" style="font-size: 14px; font-weight: 500">tc-u-se-ss-front</span>
<span style="font-size: 12.5px; color: var(--ink-2)">代理前置 · 不在任何 select 组里</span>
</div>
</section>
</main>
<nav aria-label="主导航" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px 8px 26px; background: var(--surface); border-top: 1px solid var(--line)">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; color: var(--ink-2)">
<span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.3a8 8 0 1 0 11.4 0"></path></svg></span>
<span style="font-size: 12px; font-weight: 500">连接</span>
</a>
<a href="Nodes.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; color: var(--ink)">
<span style="width: 64px; height: 32px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="6" r="1.8"></circle><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="5.5" cy="18" r="1.8"></circle><path d="M10 6h10M10 12h10M10 18h10"></path></svg></span>
<span style="font-size: 12px; font-weight: 700">节点</span>
</a>
<a href="Tailnet.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; color: var(--ink-2)">
<span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.2"></circle><circle cx="5" cy="18" r="2.2"></circle><circle cx="19" cy="18" r="2.2"></circle><path d="M11 7 6 16M13 7l5 9M7.2 18h9.6"></path></svg></span>
<span style="font-size: 12px; font-weight: 500">tailnet</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"主题"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.picked) || 'us-lax-ntt-via-tcuse';
const list = [
{ name: 'us-lax-ntt-via-tcuse', lat: '182 ms' },
{ name: 'tokyo-iij-via-tcuse', lat: '96 ms' }
];
return {
theme: this.props.dark ? 'pt dark' : 'pt',
nodes: list.map((n) => {
const on = n.name === picked;
return {
name: n.name,
lat: n.lat,
pressed: on,
bg: on ? 'var(--accent-soft)' : 'var(--surface)',
border: on ? 'var(--accent)' : 'var(--line)',
ring: on ? 'var(--accent)' : 'var(--ink-2)',
dot: on ? 'var(--accent)' : 'transparent',
pick: () => this.setState({ picked: n.name })
};
})
};
}
}
</script>
</body>
</html>
